<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff8f0;
            color: #3d332c;
            text-align: center;
        }

        .card {
            max-width: 600px;
            margin: 20px;
            padding: 55px 40px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(80, 55, 35, 0.12);
        }

        .emoji {
            font-size: 64px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 42px;
            color: #5a3928;
        }

        p {
            margin: 10px 0;
            font-size: 19px;
            line-height: 1.6;
            color: #6f6259;
        }

        .little-note {
            margin-top: 25px;
            font-size: 15px;
            color: #a18f82;
        }

        .dots {
            margin-top: 25px;
            font-size: 22px;
            letter-spacing: 8px;
            color: #c68b5c;
        }
    </style>
</head>

<body>

   <div class="card">
    <div class="emoji">🍻✨</div>

    <h1>We'll Be Right Back!</h1>

    <p>
        We're making a few updates behind the scenes.
    </p>

    <p>
        Thank you for your patience!
    </p>

    <div class="dots">• • •</div>

</div>

</body>
</html>
